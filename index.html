<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Reroll</title>
<meta name="theme-color" content="#E8ECF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Reroll">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF0; --surface:#F7F9FB; --ink:#16202E; --muted:#566374; --line:#C9D1DA;
  --btn:#16202E; --btn-ink:#F7F9FB; --soft:#DCE2E8;
  --squat:#C8363C; --hinge:#2D66B0; --push:#D9A514; --pull:#2C8A57; --lunge:#7B52B0;
  --carry:#5F6B78; --core:#1C8C93; --engine:#D7641C; --mob:#8795A6;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161E; --surface:#1A212B; --ink:#E6EBF0; --muted:#9AA6B4; --line:#2B3441;
    --btn:#E6EBF0; --btn-ink:#11161E; --soft:#232B37;
  }
}
:root[data-theme="dark"]{
  --bg:#11161E; --surface:#1A212B; --ink:#E6EBF0; --muted:#9AA6B4; --line:#2B3441;
  --btn:#E6EBF0; --btn-ink:#11161E; --soft:#232B37;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--hinge);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:14px}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.top h1{font-size:40px}
.clock{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}

/* roll screen */
.roll{background:var(--surface);border-radius:18px;padding:22px 18px;margin-bottom:16px}
.roll h2{font-size:30px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 18px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:12px 4px;border-radius:9px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.big{display:block;width:100%;border:0;border-radius:14px;padding:20px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.02em}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* blocks */
.block{background:var(--surface);border-radius:18px;padding:18px 16px 16px;margin-bottom:14px}
.block.done{opacity:.62}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bh h2{font-size:28px}
.bh .meta{font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);text-align:right}
.note{margin:6px 0 10px;color:var(--muted);font-size:15px}
.mv{display:grid;grid-template-columns:6px 1fr auto 40px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.plate{align-self:stretch;border-radius:3px;background:var(--c,var(--mob))}
.mv .nm{font-weight:600;line-height:1.25}
.mv .cue{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.mv .ds{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--muted);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}
.nmbtn{border:0;background:none;padding:0;text-align:left;font-weight:600;line-height:1.25}
.rate{padding:0 0 12px 18px;display:grid;gap:8px}
.rate .seg{margin:0}
.rate .seg button{padding:9px 4px;font-size:15px}
.rate .lbl{font-size:13px;color:var(--muted);margin-bottom:-4px}
.ph{position:relative;width:100%;max-width:380px;aspect-ratio:850/568;border-radius:12px;overflow:hidden;background:var(--soft);margin:4px 0 10px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph img.b{animation:flip 2.4s infinite}
@keyframes flip{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ph img.b{animation:none;opacity:0}}
.phwrap{padding:0 0 4px 18px}
.tph{max-width:min(380px,70vw);max-height:26vh;margin:6px auto 0;width:auto}
#timer.hasph .tnum{font-size:min(24vw,150px)}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin:0 0 14px;-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px;font-weight:600;font-size:15px}
.chips button small{font-weight:500;opacity:.75}
.chips button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.hist summary{list-style:none;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.sd{margin-top:10px;font-size:15px}
.sd .when{font-weight:600;margin-bottom:6px}
.sd h4{font-family:var(--display);font-size:18px;margin:10px 0 2px;display:flex;justify-content:space-between;gap:8px}
.sd h4 span{font-weight:600;color:var(--muted);font-size:15px}
.sd ul{list-style:none;margin:0;padding:0}
.sd li{display:grid;grid-template-columns:5px 1fr auto;gap:10px;align-items:center;padding:4px 0}
.sd li .plate{height:18px}
.sd .mvlink{border:0;background:none;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h h2{font-size:26px}
.cal-h button{border:0;background:var(--soft);width:44px;height:44px;border-radius:12px;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:13px;color:var(--muted);padding:4px 0}
.cal button{border:0;background:transparent;aspect-ratio:1;border-radius:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:16px}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button.has{background:var(--soft);font-weight:700}
.cal button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.cal .dots{display:flex;gap:3px;height:7px}
.cal .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
#timer::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#timer.flash::after{animation:fl .55s ease-out}
#timer.flash2::after{animation:fl2 1.1s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
@keyframes fl2{0%{opacity:.9}25%{opacity:0}50%{opacity:.9}75%{opacity:0}90%{opacity:.9}100%{opacity:0}}
.new{display:inline-block;font-size:12px;font-weight:600;background:var(--ink);color:var(--surface);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.swap{border:0;background:var(--soft);width:40px;height:40px;border-radius:10px;font-size:18px;line-height:1}
.swap:disabled{opacity:.3}
.letter{font-family:var(--display);color:var(--muted);margin-right:6px}
.bf{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.bf .btn{flex:1}
.field{display:flex;gap:8px;align-items:center;margin-top:12px}
.field input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:4px}
.finish{background:var(--surface);border-radius:18px;padding:18px 16px;margin:22px 0 10px}
.finish h2{font-size:26px;margin-bottom:10px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.feel button{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:12px 4px;font-weight:600}
.feel button[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:8px 0;font-size:15px}

/* log + moves */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:14px;padding:14px 12px}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1}
.stat span{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:24px;margin-bottom:8px}
.lift{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lift svg{display:block}
.hist{padding:11px 0;border-top:1px solid var(--line)}
.hist .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.pg h3{font-size:22px;display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.pg h3 i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c)}
.mrow{border-top:1px solid var(--line)}
.mrow summary{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 0;list-style:none;cursor:pointer}
.mrow summary::-webkit-details-marker{display:none}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--c);margin-left:4px}
.dot.on{background:var(--c)}
.mrow .x{color:var(--muted);text-decoration:line-through}
.mbody{padding:0 0 12px 32px;font-size:15px}
.mbody a{color:var(--ink)}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;padding:14px 0 12px;font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}

/* timer */
#timer{position:fixed;inset:0;overflow:hidden;z-index:20;display:none;flex-direction:column;background:var(--tbg,#2B3441);color:var(--tfg,#fff);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);transition:background .35s}
#timer.on{display:flex}
.tt{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:22px;font-weight:600}
.tt button{border:0;background:rgba(255,255,255,.18);color:inherit;width:46px;height:46px;border-radius:12px;font-size:22px}
.tmid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:6px;min-height:0}
.tlabel{font-family:var(--display);font-size:clamp(30px,9vw,54px);font-weight:700;line-height:1.02}
.tsub{font-size:20px;opacity:.9}
.tnum{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:min(34vw,210px);line-height:.95;margin:10px 0}
.tnext{font-size:17px;opacity:.85}
.tlist{margin:6px auto 0;padding:0;list-style:none;font-size:18px;opacity:.95}
.tbar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin:12px 0}
.tbar i{display:block;height:100%;background:currentColor;width:0}
.tctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.tctl button{border:0;border-radius:14px;padding:18px 0;font-family:var(--display);font-size:22px;font-weight:700;background:rgba(255,255,255,.18);color:inherit}
.tctl button.main{background:currentColor}
.tctl button.main span{color:var(--tbg,#2B3441)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;max-width:90vw;z-index:30;font-weight:500;display:none}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){#timer{transition:none}}
</style>
</head>

function wpick(arr,wf){const ws=arr.map(wf);const t=ws.reduce((a,b)=>a+b,0);if(!(t>0))return null;let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}

function dose(m,mult){

/* ------------------------------------------------------------- generator */
function ctxFor(energy,fam,used){
  const patCount={};
  store.history.slice(-3).forEach(h=>(h.pats||[]).forEach(p=>patCount[p]=(patCount[p]||0)+1));
  return {done:doneSet(),recent:new Set(store.history.slice(-2).flatMap(h=>h.moves||[])),patCount,used:used||new Set(),energy,noHeavyHinge:fam==='hinge'};
}
function moveW(m,ctx,use){
  if(!m.u.includes(use)||store.excluded.includes(m.id)||ctx.used.has(m.id)) return 0;
  if(ctx.noHeavyHinge && m.f.includes('h')) return 0;
  let w=1;
  if(!ctx.done.has(m.id)) w*= use==='s'?3:2;
  if(ctx.recent.has(m.id)) w*=.25;
  if(ctx.energy==='low' && /[jx]/.test(m.f)) w*=.2;
  if(use==='c' && m.f.includes('x')) w*=.4;
  const r=store.ratings[m.id]||{};
  if(r.like===1) w*=1.25;
  if(r.like===-1) w*=.6;
  if(r.hard==='hard' && ctx.energy==='low') w*=.4;
  return w;
}
function pickMove(pats,use,ctx){
  const list = M.filter(m=>!pats||pats.includes(m.p));
  let m = wpick(list,x=>moveW(x,ctx,use));
  if(!m) m = wpick(M,x=>moveW(x,ctx,use));
  if(m) ctx.used.add(m.id);
  return m;
}

function condParams(fmt,k,energy){

function generate(energy,famOverride){

  const k={amrap:3,emom:Math.random()<.5?3:4,circuit:4,tabata:3,fortime:3}[fmt];

      {key:'str',title:'Strength',meta:`${sets}\u00d7${sc.r}, every ${mmss(sc.e)}`,note:'Start a set each time the timer beeps. Rest for whatever is left of the interval.',

function suggestion(s){

/* ----------------------------------------------------------------- swaps */
function swap(bi,ii){
  const s=store.current, b=s.blocks[bi], it=b.items[ii];
  if(b.key==='str'){
    const L=LIFTS[s.fam]; s.var=(s.var+1)%L.vars.length; store.liftVar[s.fam]=s.var;
    s.lift=L.vars[s.var]; it.name=s.lift;
  } else if(b.key==='warm'){
    if(ii===0){const opts=['row','air bike','ski erg'].map(x=>'Easy '+x).filter(x=>x!==it.name);it.name=pick(opts);}
    else{const names=b.items.map(x=>x.name);const w=pick(WARM.filter(w=>!names.includes(w[0])));it.name=w[0];}
  } else if(b.key==='cool'){
    const names=b.items.map(x=>x.name); it.name=pick(COOL.filter(c=>!names.includes(c)));
  } else {
    const used=new Set(s.blocks.flatMap(x=>x.items.map(i=>i.id)).filter(Boolean));
    const ctx=ctxFor(s.energy,s.fam,used);
    const m=pickMove([it.p],it.use,ctx)||pickMove(null,it.use,ctx);
    if(m) b.items[ii]=mkItem(m,it.use,it.mult,it.mode,ctx.done,it.letter);
  }
  save(); render();
}

/* ----------------------------------------------------------------- timer */
function segments(b){
  const S=[];
  const nm=i=>i?`${i.name}`:'';
  if(b.key==='warm'||b.key==='cool'){
    b.items.forEach((it,i)=>S.push({label:it.name,sub:it.dose,secs:it.secs||60,p:it.p,next:nm(b.items[i+1])}));
  } else if(b.key==='str'){
    const it=b.items[0];
    for(let i=1;i<=b.sets;i++) S.push({label:it.name,sub:`Set ${i} of ${b.sets}: ${b.reps} reps`,secs:b.every,p:it.p,next:i<b.sets?`Set ${i+1}`:''});
  } else if(b.key==='cond'){
    const cp=b.cp, its=b.items;
    if(b.fmt==='amrap') S.push({label:`AMRAP ${cp.T}`,sub:'Keep moving',secs:cp.T*60,p:its[0]?.p||'engine',list:true});
    if(b.fmt==='fortime') S.push({label:`${cp.R} rounds for time`,sub:`${cp.cap} min cap`,secs:cp.cap*60,p:its[0]?.p||'engine',list:true});
    if(b.fmt==='emom') for(let i=0;i<cp.T;i++){const it=its[i%its.length];S.push({label:it.name,sub:`Minute ${i+1} of ${cp.T}: ${it.dose}`,secs:60,p:it.p,next:i<cp.T-1?its[(i+1)%its.length].name:''});}
    if(b.fmt==='circuit') for(let r=1;r<=cp.R;r++) its.forEach((it,j)=>{
      const last=r===cp.R&&j===its.length-1; const nx=its[(j+1)%its.length];
      S.push({label:it.name,sub:`Round ${r} of ${cp.R}`,secs:cp.W,p:it.p,next:''});
      if(!last) S.push({label:'Rest',sub:'Move to the next station',secs:60-cp.W,rest:true,next:nx.name});
    });
    if(b.fmt==='tabata') its.forEach((it,j)=>{
      for(let r=1;r<=cp.R;r++){
        S.push({label:it.name,sub:`Round ${r} of ${cp.R}`,secs:20,p:it.p});
        if(r<cp.R) S.push({label:'Rest',sub:'',secs:10,rest:true,next:it.name});
      }
      if(j<its.length-1) S.push({label:'Rest',sub:'Set up the next station',secs:60,rest:true,next:its[j+1].name});
    });
  } else if(b.key==='acc'){

function beep(freq,dur,vol=.25){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();

    const o=actx.createOscillator(),g=actx.createGain();

    o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}

    h+=`<div class="card pg"><h3 style="--c:${PCOL[p]}"><i></i>${PAT[p].n}</h3>`;
    list.forEach(m=>{
      const ex=store.excluded.includes(m.id);
      const q=encodeURIComponent(m.n.replace(/\(.*?\)/g,'')+' exercise technique');
      h+=`<details class="mrow" data-id="${m.id}" data-s="${esc((m.n+' '+PAT[p].n).toLowerCase())}" ${openMove===m.id?'open':''}><summary><span class="dot ${counts[m.id]?'on':''}" style="--c:${PCOL[p]}"></span>
        <span><span class="${ex?'x':''}">${esc(m.n)}</span>${ratingTags(m.id)}</span><span class="muted small">${counts[m.id]?counts[m.id]+'\u00d7':'not yet'}</span></summary>
        <div class="mbody">${openMove===m.id?photo(IMG[m.id]):''}<p style="margin:0 0 8px">${esc(m.cue)}</p>${rateUI(m.id).replace('class="rate"','class="rate" style="padding:0 0 12px"')}
        <div class="row"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Watch a demo</a>
        <button class="btn quiet" data-a="exclude" data-id="${m.id}" style="padding:6px 12px">${ex?'Include again':'Skip this move'}</button></div></div></details>`;
    });
    h+=`</div>`;
  });
  return h;
}

/* --------------------------------------------------------------- actions */
function readInputs(){
  const s=store.current; if(!s) return;
  const w=$('#w'), sc=$('#sc');
  if(w) s.weight=w.value.trim(); if(sc) s.score=sc.value.trim();
}
async function exportData(){
  const name=`reroll-backup-${new Date().toISOString().slice(0,10)}.json`;
  const blob=new Blob([JSON.stringify(store,null,1)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Reroll backup'}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importData(text){
  let d; try{ d=JSON.parse(text); }catch(e){ toast('That file isn\u2019t a Reroll backup.'); return; }
  if(!d||!Array.isArray(d.history)){ toast('That file isn\u2019t a Reroll backup.'); return; }
  const seen=new Set(store.history.map(h=>h.date));
  const added=d.history.filter(h=>h&&h.date&&!seen.has(h.date));
  store.history=store.history.concat(added).sort((a,b)=>a.date-b.date);
  store.excluded=[...new Set([...(store.excluded||[]),...(d.excluded||[])])];
  store.liftVar=Object.assign({},d.liftVar||{},store.liftVar||{});
  store.ratings=Object.assign({},d.ratings||{},store.ratings||{});
  save(); render(); toast(`Imported ${added.length} session${added.length===1?'':'s'}.`);
}
document.addEventListener('change',e=>{
  if(e.target.id==='imp'&&e.target.files[0]){ e.target.files[0].text().then(importData); e.target.value=''; return; } if(e.target.id==='w'||e.target.id==='sc'){ readInputs(); save(); } });
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button'); if(nb){ readInputs(); tab=nb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const a=e.target.closest('[data-a]'); if(!a) return;
  const act=a.dataset.a, s=store.current;
  if(act==='energy'){store.energy=a.dataset.e;save();render();}
  if(act==='roll'){store.current=generate(store.energy,rollFam);rollFam=null;famOpen=false;save();render();window.scrollTo(0,0);}
  if(act==='famopen'){famOpen=true;render();}
  if(act==='swap'){readInputs();swap(+a.dataset.b,+a.dataset.i);}
  if(act==='start'){readInputs();save();startTimer(+a.dataset.b);}
  if(act==='markdone'){readInputs();s.done[s.blocks[+a.dataset.b].key]=true;if(!s.startedAt)s.startedAt=Date.now();save();render();}
  if(act==='feel'){readInputs();s.feel=a.dataset.f;save();render();}
  if(act==='discard'){ if(pending==='discard'){pending=null;store.current=null;save();render();toast('Workout discarded.');} else arm('discard'); }
  if(act==='setfam'){
    const f=a.dataset.f;
    if(!s){ rollFam=f===nextFam()?null:f; render(); return; }
    if(s.done.str||f===s.fam){ famOpen=false; render(); return; }
    readInputs();
    const fresh=generate(s.energy,f);
    fresh.n=s.n; fresh.startedAt=s.startedAt; fresh.score=s.score; fresh.feel=s.feel; fresh.done=Object.assign({},s.done);
    fresh.blocks=fresh.blocks.map(b=>{ const old=s.blocks.find(o=>o.key===b.key); return s.done[b.key]&&old?old:b; });
    if(s.done.cond){fresh.format=s.format;}
    famOpen=false; store.current=fresh; save(); render();
    toast(`Today\u2019s lift: ${fresh.lift}. Unfinished blocks rebuilt around it.`);
    return;
  }
  if(act==='reenergy'||act==='reroll'){
    readInputs();
    const energy=act==='reenergy'?a.dataset.e:s.energy;
    if(act==='reenergy'&&energy===s.energy) return;
    const fresh=generate(energy,s.fam);
    fresh.n=s.n; fresh.startedAt=s.startedAt; fresh.weight=s.weight; fresh.score=s.score; fresh.feel=s.feel; fresh.done=Object.assign({},s.done);
    fresh.var=s.var; fresh.lift=s.lift;
    fresh.blocks=fresh.blocks.map(b=>{ const old=s.blocks.find(o=>o.key===b.key); return s.done[b.key]&&old?old:b; });
    const sb=fresh.blocks.find(b=>b.key==='str'); if(sb&&!s.done.str) sb.items[0].name=s.lift;
    if(s.done.str){fresh.scheme=s.scheme;}
    if(s.done.cond){fresh.format=s.format;}
    store.current=fresh; save(); render();
    toast(act==='reroll'?'Unfinished blocks rerolled.':`Switched to ${ENAMES[energy].toLowerCase()}.`);
  }
  if(act==='finish'){
    readInputs();
    const done=doneSet();
    const moves=s.blocks.filter(b=>b.key==='cond'||b.key==='acc').flatMap(b=>b.items.map(i=>i.id)).filter(Boolean);
    const newCount=moves.filter(id=>!done.has(id)).length;
    const w=parseFloat(String(s.weight).replace(',','.'));
    store.history.push({date:Date.now(),n:s.n,fam:s.fam,lift:s.lift,scheme:s.scheme,weight:isFinite(w)?w:null,format:s.format,score:s.score,feel:s.feel,energy:s.energy,
      moves,pats:(s.blocks.find(b=>b.key==='cond')?.items||[]).map(i=>i.p),newCount,mins:s.startedAt?Math.round((Date.now()-s.startedAt)/60000):null,
      start:s.startedAt||null,end:Date.now(),
      blocks:s.blocks.map(b=>({key:b.key,title:b.title,meta:b.meta,done:!!s.done[b.key],items:b.items.map(i=>({id:i.id||null,name:i.name,dose:i.dose,p:i.p}))}))});
    store.current=null; save(); render(); window.scrollTo(0,0);
    toast(`Session ${s.n} logged${newCount?`. ${newCount} new move${newCount>1?'s':''} found`:''}.`);
  }
  if(act==='rateopen'){ readInputs(); openRate=openRate===a.dataset.id?null:a.dataset.id; render(); }
  if(act==='setrate'){
    readInputs();
    const id=a.dataset.id,k=a.dataset.k,v=k==='like'?+a.dataset.v:a.dataset.v;
    const r=Object.assign({},store.ratings[id]||{});
    if(r[k]===v) delete r[k]; else r[k]=v;
    if(Object.keys(r).length) store.ratings[id]=r; else delete store.ratings[id];
    if(k==='hard'&&store.current) store.current.blocks.forEach(b=>b.items.forEach(it=>{ if(it.id===id&&MB[id]) it.dose=doseFor(MB[id],it.mult,it.mode); }));
    save(); render();
  }
  if(act==='exclude'){
    const id=a.dataset.id; const i=store.excluded.indexOf(id);
    if(i>=0) store.excluded.splice(i,1); else store.excluded.push(id);
    save(); const open=a.closest('details'); render();
  }
  if(act==='export'){ exportData(); }
  if(act==='alert'){ const k=a.dataset.k; store.alerts=Object.assign({sound:true,vibrate:true,flash:true},store.alerts); store.alerts[k]=!store.alerts[k]; save(); render(); }
  if(act==='testalert'){ alertNow('end'); if(!store.alerts.sound&&!store.alerts.flash) toast('Vibration only. iPhones ignore it in web apps.'); else if(!store.alerts.flash) toast('Screen flash is off, so nothing flashed.'); }
  if(act==='calmove'){ const m=calMonth||new Date(new Date().getFullYear(),new Date().getMonth(),1); calMonth=new Date(m.getFullYear(),m.getMonth()+(+a.dataset.d),1); calDay=null; render(); }
  if(act==='calday'){ calDay=calDay===a.dataset.k?null:a.dataset.k; render(); }
  if(act==='findmove'){
    const m=MB[a.dataset.id]; if(!m) return;
    moveQuery=m.n; openMove=m.id; tab='moves'; render(); window.scrollTo(0,0);
  }
  if(act==='del'){ const i=+a.dataset.i; if(pending==='del'+i){pending=null;store.history.splice(i,1);save();render();toast('Session deleted.');} else arm('del'+i); }
});
setInterval(()=>{const c=$('#clock');if(c&&store.current?.startedAt)c.textContent=mmss((Date.now()-store.current.startedAt)/1000);},1000);
render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})); }
// iPhone home-screen apps often resume instead of restarting, so check for a newer version on every open.
async function checkUpdate(){
  if(T) return; // never interrupt a running timer
  try{
    const t=await (await fetch('./index.html',{cache:'no-store'})).text();
    const m=t.match(/const APP_VERSION='(\d+)'/);
    if(m&&m[1]!==APP_VERSION){
      const tried=sessionStorage.getItem('reroll-tried');
      if(tried===m[1]) return;
      sessionStorage.setItem('reroll-tried',m[1]);
      readInputs(); save();
      navigator.serviceWorker?.getRegistration().then(r=>r&&r.update()).catch(()=>{});
      setTimeout(()=>location.reload(),300);
    }
  }catch(e){}
}
setTimeout(checkUpdate,1500);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
</script>
